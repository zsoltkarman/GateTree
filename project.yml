name: GateTree
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.0
    SWIFT_VERSION: 5.0
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
targets:
  GateTree:
    type: application
    platform: macOS
    sources:
      - path: GateTreeApp
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatetree.app
        PRODUCT_NAME: GateTree
        MARKETING_VERSION: 0.2.6
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GateTree
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSAppleEventsUsageDescription: GateTree activates the selected Google Chrome tab for a bookmarked web link.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: GateTree connects to local and remote systems over SSH and RDP.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Distribution settings are target-scoped so Swift package targets do
        # not inherit a macOS provisioning profile in CI.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: PZ6YC7GM6J
        PROVISIONING_PROFILE_SPECIFIER: GateTree App Store
        SWIFT_OBJC_BRIDGING_HEADER: GateTreeApp/RDP/Bridge.h
        HEADER_SEARCH_PATHS:
          - /opt/homebrew/opt/freerdp/include/freerdp3
          - /opt/homebrew/opt/freerdp/include/winpr3
          - /opt/homebrew/opt/openssl@3/include
          - /usr/local/opt/freerdp/include/freerdp3
          - /usr/local/opt/freerdp/include/winpr3
          - /usr/local/opt/openssl@3/include
        LIBRARY_SEARCH_PATHS:
          - /opt/homebrew/opt/freerdp/lib
          - /opt/homebrew/opt/openssl@3/lib
          - /usr/local/opt/freerdp/lib
          - /usr/local/opt/openssl@3/lib
        OTHER_LDFLAGS:
          - -lfreerdp-client3
          - -lfreerdp3
          - -lwinpr3
          - -lcrypto
    scheme:
      testTargets: []
