name: GateTree
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.0
    SWIFT_VERSION: 5.0
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
schemes:
  GateTree:
    build:
      targets:
        GateTree: all
    # ⌘R deliberately runs the production configuration so local testing
    # exercises the same Developer ID distribution settings as the DMG.
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
targets:
  GateTree:
    type: application
    platform: macOS
    sources:
      - path: GateTreeApp
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatetree.app
        PRODUCT_NAME: GateTree
        MARKETING_VERSION: ${GATETREE_VERSION}
        CURRENT_PROJECT_VERSION: ${GATETREE_VERSION}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GateTree
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSAppleEventsUsageDescription: GateTree needs permission to open bookmarked web links in Google Chrome and run saved commands in Terminal.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: GateTree connects to local and remote systems over SSH and RDP.
        # Workspace encryption uses only Apple's CryptoKit and CommonCrypto
        # system frameworks, which are exempt from export documentation.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_SUFeedURL: https://github.com/zsoltkarman/GateTree/releases/latest/download/appcast.xml
        INFOPLIST_KEY_SUPublicEDKey: B4lmfuKK14ZtJeyTgReD3oC1d2ejghBc4+1St99P/TE=
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Public builds are Developer ID-signed and notarized by package.sh.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PZ6YC7GM6J
        CODE_SIGN_ENTITLEMENTS: GateTreeApp/GateTree.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: GateTreeApp/RDP/Bridge.h
        HEADER_SEARCH_PATHS:
          - /opt/homebrew/opt/freerdp/include/freerdp3
          - /opt/homebrew/opt/freerdp/include/winpr3
          - /opt/homebrew/opt/openssl@3/include
          - /usr/local/opt/freerdp/include/freerdp3
          - /usr/local/opt/freerdp/include/winpr3
          - /usr/local/opt/openssl@3/include
        LIBRARY_SEARCH_PATHS:
          - /opt/homebrew/opt/freerdp/lib
          - /opt/homebrew/opt/openssl@3/lib
          - /usr/local/opt/freerdp/lib
          - /usr/local/opt/openssl@3/lib
        OTHER_LDFLAGS:
          - -lfreerdp-client3
          - -lfreerdp3
          - -lwinpr3
          - -lcrypto
