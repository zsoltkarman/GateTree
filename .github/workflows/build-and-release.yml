name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS release
    # XcodeGen 2.46 emits Xcode 16 project format (77).
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - id: version
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          FILE_VERSION="v$(tr -d '[:space:]' < VERSION)"
          if [ "$REQUESTED_VERSION" != "$FILE_VERSION" ]; then
            echo "The tag ($REQUESTED_VERSION) does not match VERSION ($FILE_VERSION)." >&2
            exit 1
          fi
          echo "value=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install native RDP dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # GitHub's macOS image can include this untrusted, unrelated tap.
          # Removing it keeps Homebrew's trust checks enabled for all formulae.
          brew untap aws/tap || true
          brew install freerdp openssl@3

      - name: Configure Developer ID signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/DeveloperID.p12"
          keychain_path="$RUNNER_TEMP/gatetree-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Configure notarization
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "No notarization API key configured; notarization is skipped."
            exit 0
          fi
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          xcrun notarytool store-credentials GateTree-notary \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

      - name: Create distributable DMG
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          NOTARY_PROFILE: GateTree-notary
        run: |
          ./build/package.sh "${{ steps.version.outputs.value }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GateTree-${{ steps.version.outputs.value }}
          path: .dist/GateTree-${{ steps.version.outputs.value }}.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --title "GateTree $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" ".dist/GateTree-$VERSION.dmg" --clobber

  testflight:
    name: Upload macOS build to TestFlight
    needs: build
    if: github.event_name == 'push'
    runs-on: macos-15
    environment: app-store

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release version
        run: |
          FILE_VERSION="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$FILE_VERSION" ]; then
            echo "The tag (${GITHUB_REF_NAME}) does not match VERSION ($FILE_VERSION)." >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install native RDP dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew untap aws/tap || true
          brew install freerdp openssl@3

      - name: Install App Store signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${CERTIFICATE_BASE64:?APP_STORE_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?APP_STORE_CERTIFICATE_PASSWORD is required}"
          : "${INSTALLER_CERTIFICATE_BASE64:?MAC_INSTALLER_CERTIFICATE_BASE64 is required}"
          : "${INSTALLER_CERTIFICATE_PASSWORD:?MAC_INSTALLER_CERTIFICATE_PASSWORD is required}"
          : "${PROFILE_BASE64:?MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 is required}"
          certificate_path="$RUNNER_TEMP/AppStoreDistribution.p12"
          installer_certificate_path="$RUNNER_TEMP/MacInstallerDistribution.p12"
          profile_path="$RUNNER_TEMP/GateTree.provisionprofile"
          keychain_path="$RUNNER_TEMP/gatetree-app-store.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          echo "$INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$installer_certificate_path"
          echo "$PROFILE_BASE64" | base64 -D > "$profile_path"
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security import "$installer_certificate_path" \
            -k "$keychain_path" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: PZ6YC7GM6J
        run: |
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER_ID:?APPLE_API_ISSUER_ID is required}"
          : "${APPLE_API_PRIVATE_KEY:?APPLE_API_PRIVATE_KEY is required}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/GateTree.xcarchive"
          export_path="$RUNNER_TEMP/export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key><dict>
              <key>com.gatetree.app</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>signingCertificate</key><string>Mac App Distribution</string>
            <key>installerSigningCertificate</key><string>Mac Installer Distribution</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodegen generate
          RDP_CFLAGS="$(pkg-config --cflags freerdp-client3 openssl)"
          RDP_LDFLAGS="$(pkg-config --libs freerdp-client3 openssl)"
          BUILD_ARCH="$(uname -m)"
          xcodebuild \
            -project GateTree.xcodeproj \
            -scheme GateTree \
            -configuration Release \
            -skipPackagePluginValidation \
            -archivePath "$archive_path" \
            OTHER_CFLAGS="$RDP_CFLAGS" \
            OTHER_LDFLAGS="$RDP_LDFLAGS" \
            ARCHS="$BUILD_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -authenticationKeyPath "$api_key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
